name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Lets a newer push to a PR cancel an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ActionManifest's validators import the full unbork backend
      # (post_run_register pulls in app.actions.register_schemas -> DB
      # models), so pydantic alone is not enough — install the backend.
      # Pin UNBORK_REPO_REF to a release tag once unbork cuts them and bump
      # it intentionally; until then track the default branch.
      - name: Fetch unbork (manifest schema source)
        run: git clone --depth 1 --branch "${UNBORK_REPO_REF:-main}" https://github.com/open-unbork/unbork.git _unbork_src
        env:
          UNBORK_REPO_REF: main

      - name: Install unbork backend
        run: |
          python -m pip install -U pip -q
          python -m pip install -e _unbork_src/backend -q

      - name: Validate every manifest against ActionManifest
        run: UNBORK_SRC=_unbork_src python scripts/validate_manifests.py

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: python -m pip install -U pip "ansible-lint>=24" "ansible-core>=2.16" -q

      # Whole-pack lint. Rule handling lives in .ansible-lint (permanent
      # skips) and .ansible-lint-ignore (per-file baseline of pre-existing
      # violations). New violations outside that baseline fail the job.
      - name: ansible-lint
        run: ansible-lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Helper scripts that roles ship under files/ and run on managed
      # hosts. Standard library only, so no install step.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: unittest
        run: python -m unittest discover -s tests -v
